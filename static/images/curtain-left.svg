<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a0613"/>
      <stop offset="20%" stop-color="#5a0a20"/>
      <stop offset="50%" stop-color="#8a1030"/>
      <stop offset="80%" stop-color="#5a0a20"/>
      <stop offset="100%" stop-color="#2a0613"/>
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="50%" stop-color="rgba(200,40,80,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
  </defs>

  <!-- Tvar zviazaného závesu – v strede výšky zúžený -->
  <path d="M 0,0
           L 180,0
           Q 120,250 60,500
           Q 120,750 180,1000
           L 0,1000
           Z"
        fill="url(#velvet)"/>

  <!-- Zvislé záhyby látky -->
  <path d="M 30,0 Q 20,250 35,500 Q 20,750 30,1000" stroke="rgba(0,0,0,0.4)" stroke-width="6" fill="none"/>
  <path d="M 70,0 Q 60,250 55,500 Q 60,750 70,1000" stroke="rgba(0,0,0,0.4)" stroke-width="5" fill="none"/>
  <path d="M 110,0 Q 95,250 75,500 Q 95,750 110,1000" stroke="rgba(0,0,0,0.4)" stroke-width="4" fill="none"/>
  <path d="M 150,0 Q 130,250 95,500 Q 130,750 150,1000" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none"/>

  <!-- Jemný svetelný odlesk na látke -->
  <path d="M 50,0 Q 40,250 45,500 Q 40,750 50,1000" stroke="rgba(220,60,100,0.25)" stroke-width="8" fill="none"/>
  <path d="M 130,0 Q 110,250 85,500 Q 110,750 130,1000" stroke="rgba(220,60,100,0.15)" stroke-width="6" fill="none"/>

  <!-- Zlatá šnúra v strede -->
  <ellipse cx="65" cy="500" rx="22" ry="12"
           fill="none" stroke="#d4af37" stroke-width="4"/>
  <ellipse cx="65" cy="500" rx="22" ry="12"
           fill="none" stroke="#f4d87a" stroke-width="2"/>
</svg>