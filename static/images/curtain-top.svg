<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="velvetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a1030"/>
      <stop offset="40%" stop-color="#5a0a20"/>
      <stop offset="100%" stop-color="#2a0613"/>
    </linearGradient>
  </defs>

  <!-- Hlavný tvar pelmetu - obrátené V -->
  <path d="M 500,0
           L 1000,350
           L 1000,400
           L 0,400
           L 0,350
           Z"
        fill="url(#velvetTop)"/>

  <!-- Zlatý lem pozdĺž hornej hrany -->
  <path d="M 500,0
           L 1000,350"
        stroke="#d4af37" stroke-width="6" fill="none"/>
  <path d="M 500,0
           L 0,350"
        stroke="#d4af37" stroke-width="6" fill="none"/>

  <!-- Jemný vnútorný zlatý lem -->
  <path d="M 500,15
           L 985,355"
        stroke="#f4d87a" stroke-width="2" fill="none"/>
  <path d="M 500,15
           L 15,355"
        stroke="#f4d87a" stroke-width="2" fill="none"/>

  <!-- Záhyby látky - zvislé línie -->
  <line x1="150" y1="270" x2="150" y2="400" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="300" y1="180" x2="300" y2="400" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="500" y1="80" x2="500" y2="400" stroke="rgba(0,0,0,0.5)" stroke-width="4"/>
  <line x1="700" y1="180" x2="700" y2="400" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="850" y1="270" x2="850" y2="400" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>

  <!-- Svetelné odlesky na látke -->
  <line x1="220" y1="230" x2="220" y2="400" stroke="rgba(220,60,100,0.2)" stroke-width="6"/>
  <line x1="400" y1="130" x2="400" y2="400" stroke="rgba(220,60,100,0.25)" stroke-width="8"/>
  <line x1="600" y1="130" x2="600" y2="400" stroke="rgba(220,60,100,0.25)" stroke-width="8"/>
  <line x1="780" y1="230" x2="780" y2="400" stroke="rgba(220,60,100,0.2)" stroke-width="6"/>

  <!-- Ozdobné strapce na koncoch -->
  <circle cx="500" cy="8" r="10" fill="#d4af37"/>
  <circle cx="500" cy="8" r="5" fill="#f4d87a"/>
</svg>