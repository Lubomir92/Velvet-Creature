<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="velvetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a1030"/>
      <stop offset="40%" stop-color="#5a0a20"/>
      <stop offset="100%" stop-color="#2a0613"/>
    </linearGradient>
  </defs>

  <!-- Hlavný tvar drapérie - vrchol v strede hore, klesá do strán -->
  <path d="M 500,0
           L 1000,220
           L 1000,300
           L 0,300
           L 0,220
           Z"
        fill="url(#velvetTop)"/>

  <!-- Zlatý lem pozdĺž šikmých hrán -->
  <path d="M 500,0 L 1000,220" stroke="#d4af37" stroke-width="5" fill="none"/>
  <path d="M 500,0 L 0,220" stroke="#d4af37" stroke-width="5" fill="none"/>

  <!-- Jemný vnútorný zlatý lem -->
  <path d="M 500,12 L 985,225" stroke="#f4d87a" stroke-width="2" fill="none"/>
  <path d="M 500,12 L 15,225" stroke="#f4d87a" stroke-width="2" fill="none"/>

  <!-- Zvislé záhyby látky -->
  <line x1="180" y1="160" x2="180" y2="300" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="340" y1="100" x2="340" y2="300" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="500" y1="50" x2="500" y2="300" stroke="rgba(0,0,0,0.5)" stroke-width="4"/>
  <line x1="660" y1="100" x2="660" y2="300" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>
  <line x1="820" y1="160" x2="820" y2="300" stroke="rgba(0,0,0,0.4)" stroke-width="3"/>

  <!-- Svetelné odlesky na látke -->
  <line x1="260" y1="130" x2="260" y2="300" stroke="rgba(220,60,100,0.25)" stroke-width="6"/>
  <line x1="420" y1="70" x2="420" y2="300" stroke="rgba(220,60,100,0.3)" stroke-width="8"/>
  <line x1="580" y1="70" x2="580" y2="300" stroke="rgba(220,60,100,0.3)" stroke-width="8"/>
  <line x1="740" y1="130" x2="740" y2="300" stroke="rgba(220,60,100,0.25)" stroke-width="6"/>

  <!-- Zlatá ozdoba na vrchole -->
  <circle cx="500" cy="6" r="10" fill="#d4af37"/>
  <circle cx="500" cy="6" r="5" fill="#f4d87a"/>
</svg>