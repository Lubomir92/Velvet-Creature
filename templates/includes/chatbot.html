{% load static %}
{% load i18n %}

<!-- Chatbot Widget -->
<div id="chatbot-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 9998;">
    
    <!-- Chat Button -->
    <button onclick="toggleChat()" style="
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b6914, #d4af37);
        border: none;
        cursor: pointer;
        font-size: 30px;
        box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        transition: transform 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        🦇
    </button>

    <!-- Chat Window -->
    <div id="chat-window" style="
        display: none;
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 350px;
        max-height: 500px;
        background: rgba(10, 5, 5, 0.95);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 9998;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    ">
        <!-- Header -->
        <div style="
            background: linear-gradient(135deg, #8b6914, #d4af37);
            padding: 15px;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        ">
            <span>🦇 Velvet Creature</span>
            <button onclick="toggleChat()" style="
                background: none;
                border: none;
                color: #0a0a0a;
                font-size: 20px;
                cursor: pointer;
            ">✕</button>
        </div>

        <!-- Messages -->
        <div id="chat-messages" style="
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
        ">
            <div class="bot-message" style="
                background: rgba(212, 175, 55, 0.1);
                border: 1px solid rgba(212, 175, 55, 0.2);
                padding: 10px 15px;
                border-radius: 10px;
                margin-bottom: 10px;
                color: #c0b090;
                font-size: 14px;
            ">
                {% trans "Bonjour! Je suis l'assistant Velvet Creature. Comment puis-je vous aider?" as default_greeting %}
                {{ default_greeting }}
            </div>
        </div>

        <!-- Quick Questions -->
        <div id="quick-questions" style="
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        ">
            <button onclick="askBot('livraison')" class="quick-btn">📦 Livraison</button>
            <button onclick="askBot('paiement')" class="quick-btn">💳 Paiement</button>
            <button onclick="askBot('produits')" class="quick-btn">🖨️ Produits</button>
            <button onclick="askBot('retour')" class="quick-btn">↩️ Retour</button>
        </div>

        <!-- Input -->
        <div style="
            display: flex;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        ">
            <input id="chat-input" type="text" placeholder="Votre question..." style="
                flex: 1;
                padding: 10px 15px;
                background: rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(212, 175, 55, 0.2);
                border-radius: 20px;
                color: #e0d7c0;
                font-size: 14px;
                outline: none;
            " onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" style="
                margin-left: 8px;
                padding: 10px 15px;
                background: #d4af37;
                border: none;
                border-radius: 20px;
                cursor: pointer;
                font-weight: bold;
                color: #0a0a0a;
            ">➤</button>
        </div>
    </div>
</div>

<style>
    .quick-btn {
        padding: 8px 12px;
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 20px;
        color: #d4af37;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .quick-btn:hover {
        background: rgba(212, 175, 55, 0.2);
    }
    .user-message {
        background: rgba(212, 175, 55, 0.3);
        padding: 10px 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        color: #fff;
        font-size: 14px;
        text-align: right;
    }
    #chat-messages::-webkit-scrollbar {
        width: 5px;
    }
    #chat-messages::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
    }
    #chat-messages::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 10px;
    }
</style>

<script>
    let chatOpen = false;

    function toggleChat() {
        chatOpen = !chatOpen;
        const window_ = document.getElementById('chat-window');
        window_.style.display = chatOpen ? 'block' : 'none';
    }

    function getCurrentLanguage() {
        const path = window.location.pathname;
        if (path.startsWith('/fr/')) return 'fr';
        if (path.startsWith('/sk/')) return 'sk';
        if (path.startsWith('/en/')) return 'en';
        return 'fr';
    }

    function addMessage(text, isUser = false) {
        const messages = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = isUser ? 'user-message' : 'bot-message';
        div.style.cssText = isUser ? 
            'background: rgba(212, 175, 55, 0.3); padding: 10px 15px; border-radius: 10px; margin-bottom: 10px; color: #fff; font-size: 14px; text-align: right;' :
            'background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.2); padding: 10px 15px; border-radius: 10px; margin-bottom: 10px; color: #c0b090; font-size: 14px;';
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function askBot(question) {
        addMessage(question, true);
        sendToBot(question);
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        addMessage(message, true);
        sendToBot(message);
    }

    function sendToBot(message) {
        const language = getCurrentLanguage();
        fetch('/' + getCurrentLanguage() + '/chatbot/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: message,
                language: language
            })
        })
        .then(response => response.json())
        .then(data => {
            addMessage(data.response);
        })
        .catch(() => {
            addMessage('Erreur de connexion. Veuillez réessayer.');
        });
    }
</script>
