<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Commande livrée</title>
</head>
<body style="background:#111;color:#eee;font-family:Arial;padding:30px;">
<div style="max-width:600px;margin:auto;background:#1b1b1b;padding:30px;border-radius:12px;">
<h1 style="color:#d4af37;">Velvet Creature</h1>
<h2>🎉 Votre commande a été livrée</h2>
<p>Bonjour {{ order.first_name }},</p>
<p>Votre commande a été livrée avec succès.</p>
<p>Nous espérons que vous apprécierez votre achat !</p>
<hr>
<h3>Numéro de commande</h3><p>{{ order.order_number }}</p>
<h3>Total</h3><p>€{{ order.total_price }}</p>
<p style="color:#888;margin-top:40px;">Merci de soutenir Velvet Creature.</p>
</div>
</body>
</html>
