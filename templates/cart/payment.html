{% extends "base.html" %}

{% block title %}Payment{% endblock %}

{% block content %}

<div class="success-page">

    <div class="success-box">

        <h1>Payment</h1>

        <p>Order #{{ order.id }}</p>
        <p>Total: <strong>{{ order.total_price }} €</strong></p>

        <a href="{% url 'payment_success' order.id %}" class="btn">
            Pay now
        </a>

    </div>

</div>

{% endblock %}
