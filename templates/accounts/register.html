<h1>Register</h1>

<!-- 🔴 TU SA ZOBRAZIA CHYBY -->
{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    <input name="username" placeholder="Username">
    <br><br>

    <input name="password" type="password" placeholder="Password">
    <br><br>

    <button type="submit">Register</button>
</form>
