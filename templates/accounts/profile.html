{% extends "base.html" %}

{% block content %}

<h1 style="color:#d4af37;">My Orders</h1>

{% for order in orders %}

<div class="card" style="margin-bottom:15px;">

    <h3>Order #{{ order.id }}</h3>

    <p>Total: {{ order.total }} €</p>

    <p style="color:#aaa;">{{ order.created }}</p>

</div>

{% empty %}
<p>No orders yet.</p>
{% endfor %}

{% endblock %}
