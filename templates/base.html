<html lang="{{ LANGUAGE_CODE }}">

<head>


<link rel="icon" type="image/png" href="{% static 'images/favicon_velvet_creature.png' %}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Velvet Creature
        {% endblock %}
    </title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VP3E5ZHH0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VP3E5ZHH0N');
    </script>

    <!-- Presmerovanie na francúzštinu -->
    <script>
    if (window.location.pathname === '/' || window.location.pathname === '') {
        window.location.replace('/fr/');
    }
    </script>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/shop.css' %}">
    <link rel="stylesheet" href="{% static 'css/product.css' %}">
    <link rel="stylesheet" href="{% static 'css/cart.css' %}">
    <link rel="stylesheet" href="{% static 'css/wishlist.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<!-- PAVUČINY V ROHOCH -->
<div style="position: fixed; top: 0; left: 0; font-size: 120px; opacity: 0.08; pointer-events: none; z-index: 0; transform: rotate(180deg);">🕸️</div>
<div style="position: fixed; top: 0; right: 0; font-size: 120px; opacity: 0.08; pointer-events: none; z-index: 0; transform: rotate(270deg);">🕸️</div>
<div style="position: fixed; bottom: 0; left: 0; font-size: 100px; opacity: 0.06; pointer-events: none; z-index: 0; transform: rotate(90deg);">🕸️</div>
<div style="position: fixed; bottom: 0; right: 0; font-size: 100px; opacity: 0.06; pointer-events: none; z-index: 0;">🕸️</div>

<!-- LIETAJÚCE NETOPIERE -->
<div id="batsContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden;"></div>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 0, 15, 0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
">
    <div style="font-size: 60px; animation: spin 1s linear infinite;">🎃</div>
    <div style="color: #b482ff; font-family: 'Playfair Display', serif; font-size: 18px; letter-spacing: 2px; animation: pulse 1.5s ease-in-out infinite;">
        {% trans "Loading..." %}
    </div>
</div>

<style>
    body {
        font-family: "EB Garamond", "Playfair Display", serif !important;
        font-size: 18px !important;
        letter-spacing: 0.3px !important;
        line-height: 1.7 !important;
    }
    h1, h2, h3, h4 {
        font-family: "EB Garamond", "Playfair Display", serif !important;
        letter-spacing: 0.5px !important;
    }
    h1 { font-size: 2.2rem !important; font-weight: 700 !important; }
    h2 { font-size: 1.6rem !important; font-weight: 600 !important; }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
    }
</style>

<div id="toast-message" class="toast-message"></div>

{% include "includes/navbar.html" %}

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<!-- CART OVERLAY -->
<div id="drawer-overlay" class="drawer-overlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div id="cart-drawer" class="cart-drawer">
    {% include "cart/cart_drawer.html" %}
</div>

<!-- JAVASCRIPT -->
<script>
console.log("VELVET CREATURE SYSTEM LOADED");

window.openCart = function(){
    document.getElementById("cart-drawer").classList.add("open");
    document.getElementById("drawer-overlay").classList.add("active");
}

window.closeCart = function(){
    document.getElementById("cart-drawer").classList.remove("open");
    document.getElementById("drawer-overlay").classList.remove("active");
}

window.addToCart = function(id){
fetch(`/cart/add/${id}/`)
.then(response => response.json())
.then(data => {
    if(!data.success) return;
    updateBadge(data.cart_count);
    refreshDrawer();
    openCart();
});
}

window.changeQty = function(id, action){
fetch(`/cart/${action}/${id}/`)
.then(response => response.json())
.then(data => {
    if(!data.success){ alert(data.message); return; }
    updateBadge(data.cart_count);
    refreshDrawer();
    if(document.querySelector(".cart-page")){ location.reload(); }
});
}

window.removeItem = function(id){
fetch(`/cart/remove/${id}/`)
.then(response => response.json())
.then(data => {
    if(!data.success) return;
    updateBadge(data.cart_count);
    refreshDrawer();
    if(document.querySelector(".cart-page")){ location.reload(); }
});
}

function updateBadge(count){
document.querySelectorAll(".cart-count, .drawer-count").forEach(element => {
    element.innerText = count;
});
}

function refreshDrawer(){
fetch("/cart/drawer/")
.then(response => response.text())
.then(html => {
document.getElementById("cart-drawer").innerHTML = html;
});
}

window.toggleMenu = function(){
document.getElementById("mobileMenu").classList.toggle("open");
}

window.toggleWishlist = function(event, productId){
event.preventDefault();
fetch(`/wishlist/toggle/${productId}/`)
.then(response => response.json())
.then(data => {
    if(!data.success) return;
    const icon = document.getElementById(`wishlist-icon-${productId}`);
    if(icon){
        if(data.added){
            icon.classList.add("active");
            showToast("🎃 " + (document.documentElement.lang === 'fr' ? 'Ajouté à la liste de souhaits' : document.documentElement.lang === 'sk' ? 'Pridané do zoznamu želaní' : 'Added to Wishlist'));
        } else {
            icon.classList.remove("active");
            showToast("🎃 " + (document.documentElement.lang === 'fr' ? 'Retiré de la liste de souhaits' : document.documentElement.lang === 'sk' ? 'Odstránené zo zoznamu želaní' : 'Removed from Wishlist'));
        }
    }
});
}

window.removeWishlistItem = function(productId){
fetch(`/wishlist/toggle/${productId}/`)
.then(response => response.json())
.then(data => {
    if(data.success && !data.added){
        const card = document.getElementById(`wishlist-card-${productId}`);
        if(card){ card.remove(); }
        showToast("🎃 Removed from Wishlist");
    }
});
}

window.showToast = function(message){
let toast = document.getElementById("toast-message");
if(!toast) return;
toast.innerHTML = message;
toast.classList.add("show");
setTimeout(()=>{ toast.classList.remove("show"); },2500);
}
</script>

<script>
function toggleLangDropdown() {
    var dropdown = document.getElementById('langDropdown');
    dropdown.classList.toggle('show');
}

document.addEventListener('click', function(e) {
    var langLink = e.target.closest('.lang-flag-link, .lang-item, .mobile-language a');
    if (langLink && langLink.getAttribute('href') && langLink.getAttribute('href').startsWith('/')) {
        e.preventDefault();
        var overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';
        var currentPath = window.location.pathname;
        var pathParts = currentPath.split('/').filter(Boolean);
        if (pathParts[0] === 'fr' || pathParts[0] === 'en' || pathParts[0] === 'sk') {
            pathParts.shift();
        }
        var restOfPath = '/' + pathParts.join('/');
        setTimeout(function() {
            window.location.href = langLink.getAttribute('href') + restOfPath.replace(/^\//, '');
        }, 600);
    }
});

document.addEventListener('click', function(event) {
    var dropdown = document.getElementById('langDropdown');
    var button = event.target.closest('.lang-current');
    if (!button && dropdown && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
    }
});
</script>

<script>
(function() {
    const container = document.getElementById('batsContainer');
    if (!container) return;
    const style = document.createElement('style');
    style.textContent = `
        @keyframes flyBat {
            0% { transform: translate(0, 0) rotate(0deg) scale(0.8); }
            25% { transform: translate(120px, -60px) rotate(12deg) scale(1.1); }
            50% { transform: translate(250px, 40px) rotate(-8deg) scale(0.9); }
            75% { transform: translate(80px, -35px) rotate(6deg) scale(1.05); }
            100% { transform: translate(-30px, 10px) rotate(0deg) scale(0.8); }
        }
    `;
    document.head.appendChild(style);
    for (let i = 0; i < 6; i++) {
        const bat = document.createElement('span');
        bat.textContent = '🦇';
        bat.style.cssText = `
            position: absolute;
            left: ${Math.random() * 90}%;
            top: ${Math.random() * 80}%;
            font-size: ${22 + Math.random() * 28}px;
            opacity: 0.2;
            animation: flyBat ${8 + Math.random() * 12}s linear infinite;
            animation-delay: ${Math.random() * 8}s;
            filter: drop-shadow(0 0 6px rgba(180, 130, 255, 0.3));
            pointer-events: none;
        `;
        container.appendChild(bat);
    }
})();
</script>

<div id="customCursor" style="
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 24px;
    transform: translate(-50%, -50%);
    transition: transform 0.05s ease-out;
    filter: drop-shadow(0 0 8px rgba(180, 130, 255, 0.6));
    display: none;
">🕷️</div>

<script>
(function() {
    const cursor = document.getElementById('customCursor');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;
    document.body.style.cursor = 'none';
    cursor.style.display = 'block';
    document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    function animate() {
        cursorX += (mouseX - cursorX) * 0.15;
        cursorY += (mouseY - cursorY) * 0.15;
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
        requestAnimationFrame(animate);
    }
    animate();
    document.addEventListener('mouseover', function(e) {
        if (e.target.closest('a, button, .btn, input[type="submit"], .cart-icon, .lang-flag-link')) {
            cursor.style.fontSize = '30px';
            cursor.style.filter = 'drop-shadow(0 0 12px rgba(255, 100, 100, 0.8))';
        }
    });
    document.addEventListener('mouseout', function(e) {
        if (e.target.closest('a, button, .btn, input[type="submit"], .cart-icon, .lang-flag-link')) {
            cursor.style.fontSize = '24px';
            cursor.style.filter = 'drop-shadow(0 0 8px rgba(180, 130, 255, 0.6))';
        }
    });
})();
</script>

</body>
</html>
