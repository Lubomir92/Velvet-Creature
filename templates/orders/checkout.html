{% extends "base.html" %}

{% block content %}

<div class="checkout-page">

    <h1 class="section-title">Secure Checkout</h1>

    <div class="checkout-layout">

        <!-- LEFT -->
        <div class="checkout-items">

            <div class="checkout-card">
                <h2>Total</h2>
                <h1 class="gold">€{{ total }}</h1>
            </div>

            <div class="trust-box">
                <p>🔒 Secure payment via Stripe</p>
                <p>⚡ Instant processing</p>
                <p>📦 Fast shipping worldwide</p>
            </div>

        </div>

        <!-- RIGHT -->
        <div class="checkout-summary">

            <h2>Payment</h2>

            <form method="post">

{% csrf_token %}


<input 
type="email"
name="email"
placeholder="Email"
required>


<input
type="text"
name="first_name"
placeholder="First name"
required>


<input
type="text"
name="last_name"
placeholder="Last name"
required>


<input
type="text"
name="address"
placeholder="Address"
required>


<input
type="text"
name="city"
placeholder="City"
required>


<input
type="text"
name="country"
placeholder="Country"
required>


<button type="submit" class="btn-primary full">
Pay securely 💳
</button>


</form>

            <p class="small-text">
                Your payment is encrypted and safe.
            </p>

        </div>

    </div>

</div>

{% endblock %}
