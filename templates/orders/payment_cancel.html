{% extends "base.html" %}
{% load i18n %}

{% block content %}

<div class="cart-page" style="text-align:center;">

    <h1 style="color:#ff4d4d;">{% trans "Payment Cancelled" %}</h1>

    <p style="margin-top:20px;">
        {% trans "You can try again whenever you're ready." %}
    </p>

    <a href="{% url 'checkout' %}" class="checkout-btn" style="display:inline-block; margin-top:30px; max-width:300px;">
        {% trans "Back to Checkout" %}
    </a>

</div>

{% endblock %}
