{% extends "base.html" %}


{% block title %}
Edit Product
{% endblock %}


{% block content %}


<div style="
max-width:800px;
margin:40px auto;
">


<h1 style="
color:#d4af37;
margin-bottom:30px;
">
Edit {{ product.name }}
</h1>



<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


{{ form.as_p }}


<button
type="submit"
style="
background:#d4af37;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;
">

Save changes

</button>


</form>


</div>


{% endblock %}
